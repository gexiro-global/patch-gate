[build-system]
requires = ["setuptools>=68,<77", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-gate"
version = "0.1.1"
description = "Policy-gated application of untrusted unified diffs."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Gexiro Global Enterprises Ltd"}]
keywords = ["diff", "patch", "security", "policy", "git"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gexiro-global/patch-gate"
Repository = "https://github.com/gexiro-global/patch-gate"

[project.scripts]
patch-gate = "patch_gate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patch_gate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
